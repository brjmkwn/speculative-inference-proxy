services:
  speculative-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speculative-inference-proxy
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - TARGET_MODEL_ID=Qwen/Qwen2.5-1.5B-Instruct
      - DRAFT_MODEL_ID=Qwen/Qwen2.5-0.5B-Instruct
      - LOOKAHEAD_K=4
      - DEVICE=auto
      - DTYPE=auto
      - LOG_LEVEL=INFO
      - USE_MOCK_ENGINE=false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  huggingface-cache:
    name: speculative-proxy-hf-cache
